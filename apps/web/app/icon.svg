<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#07090C"/>
  <!-- The brand's own state glyph: a wallet half drained. Ring is the capacity,
       the fill is what is left. Reads as a dot at 16px, as a meter at 32px. -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#1C2230" stroke-width="3"/>
  <path d="M16 25a9 9 0 0 1 0-18Z" fill="#00A6C0"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#3DE0F5" stroke-width="1.5" opacity="0.55"/>
</svg>
